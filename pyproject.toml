[build-system]
requires = ["setuptools>=77"]  # 77+ reads the SPDX `license = "MIT"` form
build-backend = "setuptools.build_meta"

[project]
name = "quacky-sql"
version = "0.2.0"
description = "Ask your data questions in plain English: CSV, Excel, SQLite and Postgres, answered with safe DuckDB SQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Varnika Bajpai" }]
requires-python = ">=3.11"
# Lower bounds only, so Quacky installs next to other packages.
# requirements.txt pins exact versions for reproducible development and evals.
dependencies = [
    "duckdb>=2.0",
    "openai>=3.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "sqlglot>=30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quacky = "quacky.cli:main"

[project.urls]
Repository = "https://github.com/VarnikaBajpai4/Quacky"

[tool.setuptools]
packages = ["quacky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
